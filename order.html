<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Place Order - Subira's Collection</title>

<link rel="stylesheet" href="style.css">

<style>

.order-container{
    max-width:700px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

.order-container input,
.order-container textarea{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ddd;
    border-radius:8px;
    box-sizing:border-box;
}

.order-btn{
    width:100%;
    padding:12px;
    background:#b76e79;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

.order-btn:hover{
    background:#9f5d67;
}

#message{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
}

</style>

</head>

<body>

<header>
<h1>Subira's Collection</h1>
<p>Place Your Order</p>
</header>

<div class="order-container">

<h2>Order Form</h2>

<input
type="text"
id="customerName"
placeholder="Your Name">

<input
type="text"
id="phone"
placeholder="Phone Number">

<input
type="text"
id="product"
placeholder="Product Name">

<input
type="number"
id="quantity"
placeholder="Quantity">

<textarea
id="address"
placeholder="Delivery Address">
</textarea>

<button
class="order-btn"
onclick="submitOrder()">

Place Order

</button>

<p id="message"></p>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";

import {
getFirestore,
collection,
addDoc
}
from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyB_NHnimxCj3KSk3oUHS4xcyyYGqJ2x9dA",
authDomain: "subira-s-collection.firebaseapp.com",
projectId: "subira-s-collection",
storageBucket: "subira-s-collection.firebasestorage.app",
messagingSenderId: "1059752058697",
appId: "1:1059752058697:web:d47b6563de3e664a324498"

};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.submitOrder = async function(){

    try{

        await addDoc(collection(db,"orders"),{

            customerName:
            document.getElementById("customerName").value,

            phone:
            document.getElementById("phone").value,

            product:
            document.getElementById("product").value,

            quantity:
            Number(document.getElementById("quantity").value),

            address:
            document.getElementById("address").value,

            status:"Pending"

        });

        document.getElementById("message").innerHTML =
        "✅ Order submitted successfully!";

    }

    catch(error){

        console.error(error);

        document.getElementById("message").innerHTML =
        "❌ Error submitting order.";

    }

}

</script>

</body>
</html>
