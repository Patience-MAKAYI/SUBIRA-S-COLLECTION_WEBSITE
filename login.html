<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f8e8e0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.login-box{
background:white;
padding:30px;
border-radius:15px;
width:350px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

h2{
text-align:center;
color:#b76e79;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ddd;
border-radius:8px;
}

button{
width:100%;
padding:12px;
background:#b76e79;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#9f5d67;
}

#message{
margin-top:10px;
text-align:center;
}
</style>
</head>

<body>

<div class="login-box">

<h2>Admin Login</h2>

<input type="email" id="email" placeholder="Email">

<input type="password" id="password" placeholder="Password">

<button onclick="login()">Login</button>

<p id="message"></p>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
apiKey: "AIzaSyB_NHnimxCj3KSk3oUHS4xcyyYGqJ2x9dA",
authDomain: "subira-s-collection.firebaseapp.com",
projectId: "subira-s-collection",
storageBucket: "subira-s-collection.firebasestorage.app",
messagingSenderId: "1059752058697",
appId: "1:1059752058697:web:d47b6563de3e664a324498"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.login = async function(){

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

try{

await signInWithEmailAndPassword(
auth,
email,
password
);

window.location.href="admin.html";

}catch(error){

document.getElementById("message").innerHTML =
"Login failed";

}

}

</script>

</body>
</html>h
