<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - Subira's Collection</title>
<link rel="stylesheet" href="style.css">
<style>
/* Contact form styling */
.contact-form {
  max-width: 500px;
  margin: 20px auto;
  padding: 20px;
  background: #f3e6e8;
  border-radius: 10px;
}

.contact-form input,
.contact-form textarea {
  width: 100%;
  padding: 10px;
  margin: 10px 0;
  border: 1px solid #ccc;
  border-radius: 5px;
}

.contact-form button {
  background: #b76e79;
  color: white;
  border: none;
  padding: 12px 20px;
  cursor: pointer;
  border-radius: 5px;
}

.contact-form button:hover {
  background: #8c4f59;
}
</style>
</head>

<body>

<header>
<h1>Subira's Collection</h1>
<p>Elegant Clip-On Earrings & Pocket Perfumes for Every Occasion</p>
</header>

<nav>
<a href="index.html">Home</a>
<a href="earrings.html">Clip-On Earrings</a>
<a href="perfumes.html">Pocket Perfumes</a>
<a href="gallery.html">Gallery</a>
<a href="about.html">About</a>
<a href="contact.html">Contact</a>
</nav>

<section>
<h2>Contact Us</h2>
<p>We’d love to hear from you! Please fill out the form below and we will get back to you as soon as possible.</p>

<div class="contact-form">
<form action="kuwundamakayi@gmail.com" method="post" enctype="text/plain">
<label for="name">Name</label>
<input type="text" id="name" name="name" placeholder="Your Name" required>

<label for="email">Email</label>
<input type="email" id="email" name="email" placeholder="Your Email" required>

<label for="subject">Subject</label>
<input type="text" id="subject" name="subject" placeholder="Subject" required>

<label for="message">Message</label>
<textarea id="message" name="message" placeholder="Your Message" rows="5" required></textarea>

<button type="submit">Send Message</button>
</form>
</div>

</section>

<footer>
<p>© 2026 Subira's Collection</p>
</footer>

</body>
</html>
