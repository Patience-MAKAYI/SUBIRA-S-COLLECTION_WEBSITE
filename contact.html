<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact - Subira's Collection</title>

<link rel="stylesheet" href="style.css">

<style>

.contact-form{
    max-width:500px;
    margin:20px auto;
    padding:20px;
    background:#f3e6e8;
    border-radius:10px;
}

.contact-form input,
.contact-form textarea{
    width:100%;
    padding:10px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
}

.contact-form button{
    background:#b76e79;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:5px;
    cursor:pointer;
    width:100%;
}

.contact-form button:hover{
    background:#8c4f59;
}

</style>

</head>

<body>

<header>

<h1>Subira's Collection</h1>

<p>Elegant Clip-On Earrings & Pocket Perfumes for Every Occasion</p>

</header>

<nav>

<a href="index.html">Home</a>
<a href="earrings.html">Clip-On Earrings</a>
<a href="perfumes.html">Pocket Perfumes</a>
<a href="gallery.html">Gallery</a>
<a href="about.html">About</a>
<a href="contact.html">Contact</a>

</nav>

<section>

<h2>Contact Us</h2>

<p>
We'd love to hear from you! Fill in the form below.
</p>

<div class="contact-form">

<form id="contactForm">

<label>Name</label>

<input
type="text"
id="name"
placeholder="Your Name"
required>

<label>Email</label>

<input
type="email"
id="email"
placeholder="Your Email"
required>

<label>Subject</label>

<input
type="text"
id="subject"
placeholder="Subject"
required>

<label>Message</label>

<textarea
id="message"
rows="5"
placeholder="Your Message"
required></textarea>

<button type="submit">

Send Message

</button>

</form>

</div>

</section>

<footer>

<p>© 2026 Subira's Collection</p>

</footer>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";

import {
getFirestore,
collection,
addDoc
}
from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyB_NHnimxCj3KSk3oUHS4xcyyYGqJ2x9dA",

authDomain: "subira-s-collection.firebaseapp.com",

projectId: "subira-s-collection",

storageBucket: "subira-s-collection.firebasestorage.app",

messagingSenderId: "1059752058697",

appId: "1:1059752058697:web:d47b6563de3e664a324498"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

document.getElementById("contactForm")
.addEventListener("submit", async function(e){

e.preventDefault();

const name =
document.getElementById("name").value;

const email =
document.getElementById("email").value;

const subject =
document.getElementById("subject").value;

const message =
document.getElementById("message").value;

try{

await addDoc(collection(db,"messages"),{

name:name,
email:email,
subject:subject,
message:message,
date:new Date()

});

alert("✅ Message sent successfully!");

document.getElementById("contactForm").reset();

}

catch(error){

console.error(error);

alert("❌ Error sending message.");

}

});

</script>

</body>

</html>
